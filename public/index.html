<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="JC-LIVE에서 원하는 방송을 최대 2개까지 함께 시청하고 전사문을 확인합니다.">
<title>JC-LIVE · 방송 시청</title><link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<script type="module" src="/app.mjs"></script></head>
<body>
<header><a class="brand" href="/"><img src="/icon-192.png" width="40" height="40" alt=""><span>JC-<strong>LIVE</strong></span></a><span id="connection" role="status">방송 목록을 불러옵니다</span></header>
<main>
<section class="intro"><div><p class="eyebrow">방송 시청</p><h1>원하는 방송을 선택해 주세요</h1>
<p>최대 2개 방송을 함께 볼 수 있습니다. 선택한 방송을 다시 누르면 시청을 종료합니다.</p></div>
<p class="selection-count" id="selection-count">0 / 2 선택</p></section>
<section id="channels" class="channel-picker" aria-label="방송 8개 중 선택"></section>
<div class="notice-row"><p id="notice" role="status"></p><button id="retry" class="secondary" hidden>다시 연결</button></div>
<section id="empty-view" class="empty-view"><h2>시청할 방송을 선택해 주세요</h2><p>선택한 영상과 전사문이 이곳에 표시됩니다.</p></section>
<section id="watch-grid" class="watch-grid" aria-label="선택한 방송"></section>
<footer>전사문은 AI가 작성한 초안입니다. 영상과 표시 시점이 다를 수 있으며, 인명과 수치는 원음 확인이 필요합니다.</footer>
</main></body></html>
