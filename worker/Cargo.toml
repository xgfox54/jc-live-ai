[package]
name = "jc-live-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[features]
default = []
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[dependencies]
anyhow = "=1.0.103"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
whisper-rs = "=0.13.2"

[patch.crates-io]
bindgen = { path = "../vendor/bindgen-0.69.5" }
whisper-rs-sys = { path = "../vendor/whisper-rs-sys-0.11.1" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
